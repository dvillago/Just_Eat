<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1600" font-family="Arial, sans-serif" font-size="12" background="#ffffff">
  <rect width="1400" height="1600" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Database Tables — Part 2: Grocery, Providers &amp; Research</text>

  <!-- arrow markers -->
