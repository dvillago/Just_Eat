    <rect x="40" y="800" width="260" height="28" rx="6" fill="#993556"/>
    <rect x="40" y="822" width="260" height="6" fill="#993556"/>
    <text x="170" y="819" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">NutritionInfoResults</text>
    <text x="52" y="845" fill="#0c447c" font-weight="bold">PK</text>
    <text x="80" y="845" fill="#1a1a1a">id : uuid</text>
    <text x="52" y="862" fill="#1a1a1a" font-size="11">     title : string</text>
    <text x="52" y="879" fill="#1a1a1a" font-size="11">     source : string</text>
    <text x="52" y="896" fill="#1a1a1a" font-size="11">     url : string</text>
    <text x="52" y="913" fill="#1a1a1a" font-size="11">     summary : string</text>
    <text x="52" y="930" fill="#1a1a1a" font-size="11">     is_paywalled : boolean</text>
    <text x="52" y="947" fill="#1a1a1a" font-size="11">     free_full_text_url : string</text>
    <line x1="52" y1="847" x2="295" y2="847" stroke="#993556" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- AcademicSearchResults -->
  <!-- ═══════════════════════════════ -->
