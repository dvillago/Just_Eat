    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrl" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════ -->
  <!-- GroceryLists -->
  <!-- ═══════════════════════════════ -->
  <g id="GroceryLists">
    <rect x="40" y="70" width="230" height="130" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <rect x="40" y="70" width="230" height="28" rx="6" fill="#0f6e56"/>
    <rect x="40" y="92" width="230" height="6" fill="#0f6e56"/>
    <text x="155" y="89" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">GroceryLists</text>
    <text x="52" y="115" fill="#0c447c" font-weight="bold">PK</text>
    <text x="80" y="115" fill="#1a1a1a">id : uuid</text>
    <text x="52" y="132" fill="#a32d2d" font-weight="bold">FK</text>
    <text x="80" y="132" fill="#1a1a1a">plan_id : uuid</text>
    <text x="52" y="149" fill="#1a1a1a" font-size="11">     generated_at : datetime</text>
    <text x="52" y="166" fill="#1a1a1a" font-size="11">     estimated_total_cost : float</text>
    <line x1="52" y1="117" x2="265" y2="117" stroke="#0f6e56" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- GroceryListItems (junction) -->
  <!-- ═══════════════════════════════ -->
  <g id="GroceryListItems">
    <rect x="40" y="250" width="230" height="130" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
    <rect x="40" y="250" width="230" height="28" rx="6" fill="#854f0b"/>
    <rect x="40" y="272" width="230" height="6" fill="#854f0b"/>
    <text x="155" y="269" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">GroceryListItems</text>
    <text x="52" y="295" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="100" y="295" fill="#1a1a1a">grocery_list_id : uuid</text>
    <text x="52" y="312" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="100" y="312" fill="#1a1a1a">ingredient_id : uuid</text>
    <text x="52" y="329" fill="#1a1a1a" font-size="11">     quantity_amount : float</text>
    <text x="52" y="346" fill="#1a1a1a" font-size="11">     unit : string</text>
    <text x="52" y="363" fill="#1a1a1a" font-size="11">     estimated_price : float</text>
    <line x1="52" y1="297" x2="265" y2="297" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="52" y1="314" x2="265" y2="314" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- Ingredients (shared ref) -->
  <!-- ═══════════════════════════════ -->
  <g id="Ingredients">
    <rect x="40" y="435" width="230" height="215" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <rect x="40" y="435" width="230" height="28" rx="6" fill="#0f6e56"/>
    <rect x="40" y="457" width="230" height="6" fill="#0f6e56"/>
    <text x="155" y="454" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">Ingredients</text>
    <text x="52" y="480" fill="#1a1a1a" font-size="10" font-style="italic">(shared with Part 1)</text>
    <text x="52" y="497" fill="#0c447c" font-weight="bold">PK</text>
    <text x="80" y="497" fill="#1a1a1a">id : uuid</text>
    <text x="52" y="514" fill="#1a1a1a" font-size="11">     name : string</text>
    <text x="52" y="531" fill="#1a1a1a" font-size="11">     category : string</text>
    <text x="52" y="548" fill="#1a1a1a" font-size="11">     default_unit : string</text>
    <text x="52" y="565" fill="#1a1a1a" font-size="11">     calories_per_100g : float</text>
    <text x="52" y="582" fill="#1a1a1a" font-size="11">     protein_per_100g : float</text>
    <text x="52" y="599" fill="#1a1a1a" font-size="11">     carbs_per_100g : float</text>
    <text x="52" y="616" fill="#1a1a1a" font-size="11">     fat_per_100g : float</text>
    <text x="52" y="633" fill="#1a1a1a" font-size="11">     shelf_life_days : int</text>
    <text x="52" y="650" fill="#1a1a1a" font-size="11">     is_fresh : boolean</text>
    <line x1="52" y1="499" x2="265" y2="499" stroke="#0f6e56" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- GroceryOrders -->
  <!-- ═══════════════════════════════ -->
  <g id="GroceryOrders">
    <rect x="380" y="70" width="240" height="165" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <rect x="380" y="70" width="240" height="28" rx="6" fill="#0f6e56"/>
    <rect x="380" y="92" width="240" height="6" fill="#0f6e56"/>
    <text x="500" y="89" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">GroceryOrders</text>
    <text x="392" y="115" fill="#0c447c" font-weight="bold">PK</text>
    <text x="420" y="115" fill="#1a1a1a">id : uuid</text>
    <text x="392" y="132" fill="#a32d2d" font-weight="bold">FK</text>
    <text x="420" y="132" fill="#1a1a1a">grocery_list_id : uuid</text>
    <text x="392" y="149" fill="#a32d2d" font-weight="bold">FK</text>
    <text x="420" y="149" fill="#1a1a1a">provider_id : uuid</text>
    <text x="392" y="166" fill="#1a1a1a" font-size="11">     status : string</text>
    <text x="392" y="183" fill="#1a1a1a" font-size="11">     placed_at : datetime</text>
    <text x="392" y="200" fill="#1a1a1a" font-size="11">     estimated_delivery_time : datetime</text>
    <text x="392" y="217" fill="#1a1a1a" font-size="11">     delivery_address : string</text>
    <line x1="392" y1="117" x2="615" y2="117" stroke="#0f6e56" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- TrackingInfo -->
  <!-- ═══════════════════════════════ -->
  <g id="TrackingInfo">
    <rect x="380" y="285" width="240" height="165" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
    <rect x="380" y="285" width="240" height="28" rx="6" fill="#0f6e56"/>
    <rect x="380" y="307" width="240" height="6" fill="#0f6e56"/>
    <text x="500" y="304" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">TrackingInfo</text>
    <text x="392" y="330" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="440" y="330" fill="#1a1a1a">order_id : uuid</text>
    <text x="392" y="347" fill="#1a1a1a" font-size="11">     current_status : string</text>
    <text x="392" y="364" fill="#1a1a1a" font-size="11">     driver_lat : float</text>
    <text x="392" y="381" fill="#1a1a1a" font-size="11">     driver_lng : float</text>
    <text x="392" y="398" fill="#1a1a1a" font-size="11">     last_updated_at : datetime</text>
    <text x="392" y="415" fill="#1a1a1a" font-size="11">     estimated_arrival : datetime</text>
    <line x1="392" y1="332" x2="615" y2="332" stroke="#0f6e56" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- GroceryProviders -->
  <!-- ═══════════════════════════════ -->
  <g id="GroceryProviders">
    <rect x="750" y="70" width="240" height="182" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <rect x="750" y="70" width="240" height="28" rx="6" fill="#185fa5"/>
    <rect x="750" y="92" width="240" height="6" fill="#185fa5"/>
    <text x="870" y="89" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">GroceryProviders</text>
    <text x="762" y="115" fill="#1a1a1a" font-size="10" font-style="italic">(DoorDash, Kroger via provider_type)</text>
    <text x="762" y="132" fill="#0c447c" font-weight="bold">PK</text>
    <text x="790" y="132" fill="#1a1a1a">id : uuid</text>
    <text x="762" y="149" fill="#1a1a1a" font-size="11">     name : string</text>
    <text x="762" y="166" fill="#1a1a1a" font-size="11">     base_api_url : string</text>
    <text x="762" y="183" fill="#1a1a1a" font-size="11">     client_id : string</text>
    <text x="762" y="200" fill="#1a1a1a" font-size="11">     client_secret : string</text>
    <text x="762" y="217" fill="#1a1a1a" font-size="11">     provider_type : string</text>
    <text x="762" y="234" fill="#1a1a1a" font-size="11">     store_location_id : string</text>
    <line x1="762" y1="134" x2="985" y2="134" stroke="#185fa5" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- UserGroceryProviders (junction) -->
  <!-- ═══════════════════════════════ -->
  <g id="UserGroceryProviders">
    <rect x="750" y="300" width="240" height="98" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
    <rect x="750" y="300" width="240" height="28" rx="6" fill="#854f0b"/>
    <rect x="750" y="322" width="240" height="6" fill="#854f0b"/>
    <text x="870" y="319" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">UserGroceryProviders</text>
    <text x="762" y="345" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="810" y="345" fill="#1a1a1a">user_id : uuid</text>
    <text x="762" y="362" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="810" y="362" fill="#1a1a1a">provider_id : uuid</text>
    <line x1="762" y1="347" x2="985" y2="347" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="762" y1="364" x2="985" y2="364" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- AuthTokens -->
  <!-- ═══════════════════════════════ -->
  <g id="AuthTokens">
    <rect x="750" y="450" width="240" height="148" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
    <rect x="750" y="450" width="240" height="28" rx="6" fill="#185fa5"/>
    <rect x="750" y="472" width="240" height="6" fill="#185fa5"/>
    <text x="870" y="469" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">AuthTokens</text>
    <text x="762" y="495" fill="#0c447c" font-weight="bold">PK</text>
    <text x="790" y="495" fill="#1a1a1a">id : uuid</text>
    <text x="762" y="512" fill="#a32d2d" font-weight="bold">FK</text>
    <text x="790" y="512" fill="#1a1a1a">provider_id : uuid</text>
    <text x="762" y="529" fill="#a32d2d" font-weight="bold">FK</text>
    <text x="790" y="529" fill="#1a1a1a">user_id : uuid</text>
    <text x="762" y="546" fill="#1a1a1a" font-size="11">     access_token : string</text>
    <text x="762" y="563" fill="#1a1a1a" font-size="11">     refresh_token : string</text>
    <text x="762" y="580" fill="#1a1a1a" font-size="11">     expires_at : datetime</text>
    <line x1="762" y1="497" x2="985" y2="497" stroke="#185fa5" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

