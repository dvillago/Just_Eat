    <rect x="750" y="1010" width="240" height="98" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
    <rect x="750" y="1010" width="240" height="28" rx="6" fill="#854f0b"/>
    <rect x="750" y="1032" width="240" height="6" fill="#854f0b"/>
    <text x="870" y="1029" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">ResponseCitations</text>
    <text x="762" y="1055" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="810" y="1055" fill="#1a1a1a">response_id : uuid</text>
    <text x="762" y="1072" fill="#0c447c" font-weight="bold">PK/FK</text>
    <text x="810" y="1072" fill="#1a1a1a">academic_result_id : uuid</text>
    <line x1="762" y1="1057" x2="985" y2="1057" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
    <line x1="762" y1="1074" x2="985" y2="1074" stroke="#854f0b" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════ RELATIONSHIPS ═══════════ -->

  <!-- GroceryLists → GroceryListItems -->
  <line x1="155" y1="200" x2="155" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="163" y="230" font-size="10" fill="#555">1:1+</text>

  <!-- GroceryListItems → Ingredients -->
  <line x1="155" y1="380" x2="155" y2="435" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="163" y="412" font-size="10" fill="#555">*:1</text>

  <!-- GroceryLists → GroceryOrders -->
  <line x1="270" y1="135" x2="380" y2="135" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="300" y="128" font-size="10" fill="#555">1:0..1</text>

  <!-- GroceryOrders → TrackingInfo -->
  <line x1="500" y1="235" x2="500" y2="285" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="508" y="265" font-size="10" fill="#555">1:1</text>

  <!-- GroceryOrders → GroceryProviders -->
  <line x1="620" y1="140" x2="750" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="665" y="133" font-size="10" fill="#555">*:1</text>

  <!-- GroceryProviders → AuthTokens -->
  <line x1="870" y1="252" x2="870" y2="450" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="878" y="360" font-size="10" fill="#555">1:*</text>

  <!-- GroceryProviders → UserGroceryProviders -->
  <line x1="870" y1="252" x2="870" y2="300" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="878" y="282" font-size="10" fill="#555">1:*</text>

  <!-- AssistantResponses → ResponseCitations -->
  <line x1="870" y1="948" x2="870" y2="1010" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="878" y="984" font-size="10" fill="#555">1:*</text>

  <!-- ResponseCitations → AcademicSearchResults -->
  <line x1="750" y1="1059" x2="680" y2="1059" stroke="#555" stroke-width="1.2"/>
  <line x1="680" y1="1059" x2="680" y2="982" stroke="#555" stroke-width="1.2"/>
  <line x1="680" y1="982" x2="640" y2="982" stroke="#555" stroke-width="1.2" marker-end="url(#arrl)"/>
  <text x="688" y="1025" font-size="10" fill="#555">*:1</text>

  <!-- Legend -->
  <rect x="40" y="1200" width="580" height="130" rx="6" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="1225" font-size="13" font-weight="bold" fill="#1a1a1a">Legend</text>
  <rect x="60" y="1238" width="14" height="14" rx="2" fill="#0f6e56"/>
  <text x="82" y="1250" font-size="11" fill="#1a1a1a">Grocery cluster (Lists, Items, Orders, Tracking)</text>
  <rect x="60" y="1258" width="14" height="14" rx="2" fill="#185fa5"/>
  <text x="82" y="1270" font-size="11" fill="#1a1a1a">Provider cluster (Providers, AuthTokens)</text>
  <rect x="60" y="1278" width="14" height="14" rx="2" fill="#854f0b"/>
  <text x="82" y="1290" font-size="11" fill="#1a1a1a">Junction tables (composite PK/FK)</text>
  <rect x="60" y="1298" width="14" height="14" rx="2" fill="#993556"/>
  <text x="82" y="1310" font-size="11" fill="#1a1a1a">Research cluster (NutritionInfo, Academic, AI Responses)</text>
  <text x="360" y="1250" font-size="11" fill="#0c447c" font-weight="bold">PK</text>
  <text x="380" y="1250" font-size="11" fill="#1a1a1a">= Primary Key (underlined)</text>
