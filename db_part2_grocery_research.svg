    <rect x="380" y="800" width="260" height="182" rx="6" fill="#fbeaf0" stroke="#993556" stroke-width="1.5"/>
    <rect x="380" y="800" width="260" height="28" rx="6" fill="#993556"/>
    <rect x="380" y="822" width="260" height="6" fill="#993556"/>
    <text x="510" y="819" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="12">AcademicSearchResults</text>
    <text x="392" y="845" fill="#0c447c" font-weight="bold">PK</text>
    <text x="420" y="845" fill="#1a1a1a">id : uuid</text>
    <text x="392" y="862" fill="#1a1a1a" font-size="11">     title : string</text>
    <text x="392" y="879" fill="#1a1a1a" font-size="11">     authors : string</text>
    <text x="392" y="896" fill="#1a1a1a" font-size="11">     publication_year : int</text>
    <text x="392" y="913" fill="#1a1a1a" font-size="11">     abstract_text : string</text>
    <text x="392" y="930" fill="#1a1a1a" font-size="11">     source_api : string</text>
    <text x="392" y="947" fill="#1a1a1a" font-size="11">     article_url : string</text>
    <text x="392" y="964" fill="#1a1a1a" font-size="11">     is_open_access : boolean</text>
    <line x1="392" y1="847" x2="635" y2="847" stroke="#993556" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- AssistantResponses -->
  <!-- ═══════════════════════════════ -->
  <g id="AssistantResponses">
    <rect x="750" y="800" width="240" height="148" rx="6" fill="#fbeaf0" stroke="#993556" stroke-width="1.5"/>
    <rect x="750" y="800" width="240" height="28" rx="6" fill="#993556"/>
    <rect x="750" y="822" width="240" height="6" fill="#993556"/>
    <text x="870" y="819" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">AssistantResponses</text>
    <text x="762" y="845" fill="#0c447c" font-weight="bold">PK</text>
    <text x="790" y="845" fill="#1a1a1a">id : uuid</text>
    <text x="762" y="862" fill="#1a1a1a" font-size="11">     response_text : string</text>
    <text x="762" y="879" fill="#1a1a1a" font-size="11">     disclaimer : string</text>
    <text x="762" y="896" fill="#1a1a1a" font-size="11">     is_sourced : boolean</text>
    <text x="762" y="913" fill="#1a1a1a" font-size="11">     created_at : datetime</text>
    <line x1="762" y1="847" x2="985" y2="847" stroke="#993556" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ═══════════════════════════════ -->
  <!-- ResponseCitations (junction) -->
  <!-- ═══════════════════════════════ -->
